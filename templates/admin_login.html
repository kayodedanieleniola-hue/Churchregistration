<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Sign In | Global Harvest Outer Ringroad</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-auth-body">
  <!-- Dynamic Glowing Background Mesh Orbs -->
  <div class="auth-bg-orb orb-1" aria-hidden="true"></div>
  <div class="auth-bg-orb orb-2" aria-hidden="true"></div>
  <div class="auth-bg-orb orb-3" aria-hidden="true"></div>

  <main class="admin-auth-shell">
    <section class="admin-auth-card" aria-labelledby="adminLoginTitle">
      <div class="auth-brand">
        <div class="logo-wrapper">
          <img class="admin-brand-logo" src="{{ url_for('static', filename='branding/logo-transparent.png') }}" alt="Global Harvest Outer Ringroad logo">
        </div>
        <div class="brand-text">
          <div class="portal-badge">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Staff Portal Access</span>
          </div>
          <h1 id="adminLoginTitle">Welcome Back</h1>
          <p class="brand-subtitle">Global Harvest Outer Ringroad</p>
        </div>
      </div>

      {% if error %}
      <div class="auth-error-banner" role="alert">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" class="auth-form" id="adminLoginForm">
        <div class="input-group">
          <label for="adminUsername">Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input id="adminUsername" type="text" name="username" placeholder="Enter admin username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
          </div>
        </div>

        <div class="input-group">
          <label for="adminPassword">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input id="adminPassword" type="password" name="password" placeholder="Enter admin password" autocomplete="current-password" required>
            <button id="togglePassword" type="button" class="password-toggle-btn" aria-label="Show password" title="Toggle password visibility">
              <svg id="eyeIconShow" class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeIconHide" class="eye-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-auth-btn">
          <span>Open Admin Dashboard</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        <a href="{{ url_for('index') }}" class="back-to-public">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Public Registration
        </a>
        <div class="credentials-badge">
          <span class="dot"></span>
          <span>Credentials synced with <code>.env</code></span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const passwordInput = document.getElementById('adminPassword');
    const toggleButton = document.getElementById('togglePassword');
    const eyeIconShow = document.getElementById('eyeIconShow');
    const eyeIconHide = document.getElementById('eyeIconHide');

    toggleButton.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIconShow.classList.toggle('hidden', isPassword);
      eyeIconHide.classList.toggle('hidden', !isPassword);
      toggleButton.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });
  </script>
</body>
</html>
